name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Version label for manual dry-run artifact build (e.g. v0.2.0-beta.1)"
        required: true
        default: "v0.2.0-beta.1"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows (x86_64)
            os: windows-latest
            target: x86_64-pc-windows-msvc
            platform: windows
          - name: Linux (x86_64)
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            platform: linux
          - name: macOS (Apple Silicon)
            os: macos-15
            target: aarch64-apple-darwin
            platform: macos
            macos_arch: arm64
            macos_target: "11.0"
          - name: macOS (Intel)
            os: macos-15
            target: x86_64-apple-darwin
            platform: macos
            macos_arch: x86_64
            macos_target: "10.13"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Resolve release tag
        id: meta
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Install Linux graphics & windowing dev libraries
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libxkbcommon-dev \
            libwayland-dev \
            libx11-dev \
            libxi-dev \
            libxcursor-dev \
            libxrandr-dev \
            libxinerama-dev \
            libgl1-mesa-dev \
            libegl1-mesa-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}

      - name: Configure macOS deployment target
        if: matrix.platform == 'macos'
        run: echo "MACOSX_DEPLOYMENT_TARGET=${{ matrix.macos_target }}" >> "$GITHUB_ENV"

      - name: Build release binary
        run: cargo build --release --locked --target "${{ matrix.target }}" -p krono-desktop

      - name: Package Windows Installer (.exe) & Portable ZIP
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $tag = "${{ steps.meta.outputs.tag }}"
          $cleanVer = $tag.TrimStart("v")
          $bin = (Resolve-Path "target\${{ matrix.target }}\release\krono-desktop.exe").Path
          New-Item -ItemType Directory -Force -Path "dist" | Out-Null
          $outDir = (Resolve-Path "dist").Path

          & .\packaging\windows\package.ps1 `
            -BinaryPath $bin `
            -Version $tag `
            -OutDir $outDir

          $iscc = Get-Command iscc -ErrorAction SilentlyContinue | Select-Object -ExpandProperty Source
          if (-not $iscc) {
            foreach ($cand in @(
              "C:\Program Files (x86)\Inno Setup 6\ISCC.exe",
              "C:\Program Files\Inno Setup 6\ISCC.exe"
            )) {
              if (Test-Path $cand) { $iscc = $cand; break }
            }
          }
          if (-not $iscc) {
            choco install innosetup -y --no-progress
            $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          }
          & $iscc `
            "/DMyAppVersion=$cleanVer" `
            "/DBinaryPath=$bin" `
            "/DOutputDirPath=$outDir" `
            "/DOutputFileBase=krono-$tag-windows-x86_64-setup" `
            "packaging\windows\krono.iss"

      - name: Package Linux AppImage & tar.gz
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          TAG="${{ steps.meta.outputs.tag }}"
          BIN="target/${{ matrix.target }}/release/krono-desktop"

          bash packaging/linux/make-appimage.sh \
            "$BIN" \
            "dist/krono-${TAG}-linux-x86_64.AppImage"

          STAGE="dist/krono-${TAG}-linux-x86_64"
          mkdir -p "$STAGE"
          cp "$BIN" "${STAGE}/krono-desktop"
          chmod +x "${STAGE}/krono-desktop"
          cp packaging/linux/krono.desktop "${STAGE}/krono.desktop"
          cp packaging/icons/krono.png "${STAGE}/krono.png"
          cp packaging/linux/install.sh "${STAGE}/install.sh"
          chmod +x "${STAGE}/install.sh"
          cp README.md README.ru.md LICENSE CHANGELOG.md "${STAGE}/"
          tar -C dist -czf "dist/krono-${TAG}-linux-x86_64.tar.gz" "krono-${TAG}-linux-x86_64"
          rm -rf "$STAGE"

      - name: Package macOS DMG
        if: matrix.platform == 'macos'
        shell: bash
        run: |
          TAG="${{ steps.meta.outputs.tag }}"
          bash packaging/macos/make-dmg.sh \
            "target/${{ matrix.target }}/release/krono-desktop" \
            "${TAG}" \
            "${{ matrix.macos_target }}" \
            "dist/krono-${TAG}-macos-${{ matrix.macos_arch }}.dmg"

      - name: Upload packaged artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.target }}
          path: |
            dist/*.exe
            dist/*.zip
            dist/*.AppImage
            dist/*.tar.gz
            dist/*.dmg
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
      - name: Download all platform artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Detect prerelease tag
        id: prep
        shell: bash
        run: |
          ls -la release-assets
          if [[ "${GITHUB_REF_NAME}" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Krono ${{ github.ref_name }}"
          prerelease: ${{ steps.prep.outputs.prerelease }}
          generate_release_notes: true
          body: |
            ### Downloads / Скачивание
            - **Windows (x86_64 Installer)**: `krono-${{ github.ref_name }}-windows-x86_64-setup.exe` — run the installer (also available as portable `.zip`).
            - **macOS (Apple Silicon — M1–M4)**: `krono-${{ github.ref_name }}-macos-arm64.dmg` — drag **Krono.app** to **Applications**.
            - **macOS (Intel, 10.13+)**: `krono-${{ github.ref_name }}-macos-x86_64.dmg` — drag **Krono.app** to **Applications**.
            - **Linux (x86_64 AppImage)**: `krono-${{ github.ref_name }}-linux-x86_64.AppImage` — `chmod +x` and run directly (also available as `.tar.gz` with `./install.sh`).

            > **macOS Beta Note:** These beta builds use ad-hoc signing (`codesign -s -`). If macOS Gatekeeper blocks the first launch, run:
            > ```sh
            > xattr -cr /Applications/Krono.app
            > ```
          files: |
            release-assets/*.exe
            release-assets/*.zip
            release-assets/*.AppImage
            release-assets/*.tar.gz
            release-assets/*.dmg
