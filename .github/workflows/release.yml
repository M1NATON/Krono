name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Version label for manual dry-run artifact build (e.g. v0.2.0-beta.1)"
        required: true
        default: "v0.2.0-beta.1"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows (x86_64)
            os: windows-latest
            target: x86_64-pc-windows-msvc
            platform: windows
          - name: Linux (x86_64)
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            platform: linux
          - name: macOS (Apple Silicon)
            os: macos-14
            target: aarch64-apple-darwin
            platform: macos
            macos_arch: arm64
            macos_target: "11.0"
          - name: macOS (Intel)
            os: macos-14
            target: x86_64-apple-darwin
            platform: macos
            macos_arch: x86_64
            macos_target: "10.15"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve release tag
        id: meta
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Install Linux graphics & windowing dev libraries
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libxkbcommon-dev \
            libwayland-dev \
            libx11-dev \
            libxi-dev \
            libxcursor-dev \
            libxrandr-dev \
            libxinerama-dev \
            libgl1-mesa-dev \
            libegl1-mesa-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}

      - name: Configure macOS deployment target
        if: matrix.platform == 'macos'
        run: echo "MACOSX_DEPLOYMENT_TARGET=${{ matrix.macos_target }}" >> "$GITHUB_ENV"

      - name: Build release binary
        run: cargo build --release --locked --target "${{ matrix.target }}" -p krono-desktop

      - name: Package Windows ZIP
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          & .\packaging\windows\package.ps1 `
            -BinaryPath "target\${{ matrix.target }}\release\krono-desktop.exe" `
            -Version "${{ steps.meta.outputs.tag }}" `
            -OutDir "dist"

      - name: Package Linux tar.gz
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          TAG="${{ steps.meta.outputs.tag }}"
          STAGE="dist/krono-${TAG}-linux-x86_64"
          mkdir -p "$STAGE"
          cp "target/${{ matrix.target }}/release/krono-desktop" "${STAGE}/krono-desktop"
          chmod +x "${STAGE}/krono-desktop"
          cp packaging/linux/krono.desktop "${STAGE}/krono.desktop"
          cp packaging/icons/krono.png "${STAGE}/krono.png"
          cp packaging/linux/install.sh "${STAGE}/install.sh"
          chmod +x "${STAGE}/install.sh"
          cp README.md LICENSE CHANGELOG.md "${STAGE}/"
          tar -C dist -czf "dist/krono-${TAG}-linux-x86_64.tar.gz" "krono-${TAG}-linux-x86_64"
          rm -rf "$STAGE"

      - name: Package macOS DMG
        if: matrix.platform == 'macos'
        shell: bash
        run: |
          TAG="${{ steps.meta.outputs.tag }}"
          bash packaging/macos/make-dmg.sh \
            "target/${{ matrix.target }}/release/krono-desktop" \
            "${TAG}" \
            "${{ matrix.macos_target }}" \
            "dist/krono-${TAG}-macos-${{ matrix.macos_arch }}.dmg"

      - name: Upload packaged artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.target }}
          path: |
            dist/*.zip
            dist/*.tar.gz
            dist/*.dmg
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
      - name: Download all platform artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Generate SHA256 checksums and detect prerelease
        id: prep
        shell: bash
        run: |
          cd release-assets
          sha256sum * > SHA256SUMS.txt
          ls -la
          if [[ "${GITHUB_REF_NAME}" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Krono ${{ github.ref_name }}"
          prerelease: ${{ steps.prep.outputs.prerelease }}
          generate_release_notes: true
          body: |
            ### Downloads
            - **Windows (x86_64)**: `krono-${{ github.ref_name }}-windows-x86_64.zip` — extract and run `krono-desktop.exe`.
            - **macOS (Apple Silicon — M1/M2/M3/M4)**: `krono-${{ github.ref_name }}-macos-arm64.dmg` — drag **Krono.app** to **Applications**.
            - **macOS (Intel)**: `krono-${{ github.ref_name }}-macos-x86_64.dmg` — drag **Krono.app** to **Applications**.
            - **Linux (x86_64)**: `krono-${{ github.ref_name }}-linux-x86_64.tar.gz` — extract and run `./install.sh` (or launch `./krono-desktop` directly).

            > **macOS Beta Note:** These beta builds use ad-hoc signing (`codesign -s -`). If macOS Gatekeeper blocks the first launch, run:
            > ```sh
            > xattr -cr /Applications/Krono.app
            > ```
          files: |
            release-assets/*.zip
            release-assets/*.tar.gz
            release-assets/*.dmg
            release-assets/SHA256SUMS.txt
