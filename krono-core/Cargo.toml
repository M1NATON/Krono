[package]
name = "krono-core"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Core Markdown vault parser, Canvas/Collection models, and 3-way Git sync planner for Krono"

[dependencies]
argon2 = "0.5"
base64 = "0.22"
chacha20poly1305 = "0.10"
pulldown-cmark = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
zeroize = { version = "1.8", features = ["derive"] }
